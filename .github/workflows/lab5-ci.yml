name: lab5-ci

on:
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build services
        run: docker compose build

  smoke-check:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up -d --build
      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            for attempt in $(seq 1 8); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi
              echo "Retry $attempt/8 for $url (got: ${code:-none})"
              sleep 2
            done
            echo "FAIL $url after 8 attempts"
            return 1
          }
          check_url "http://localhost:8080/"
          check_url "http://localhost:5001/"
          check_url "http://localhost:5002/"
      - name: Stop services
        if: always()
        run: docker compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: smoke-check
    steps:
      - uses: actions/checkout@v4
      - name: Generate evidence reports
        shell: bash
        run: |
          mkdir -p reports
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > reports/report.json <<EOF
          {
            "workflow_name": "lab5-ci",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_timestamp": "${timestamp}"
          }
          EOF
          cat > reports/report.md <<EOF
          ## Lab 05 Workflow Report

          - Workflow: lab5-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Generated: ${timestamp}
          EOF
          printf 'Run URL:\nhttps://github.com/%s/actions/runs/%s\n' "${{ github.repository }}" "${{ github.run_id }}" > reports/run-view.md
      - uses: actions/upload-artifact@v4
        with:
          name: lab5-report
          path: reports/
